<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="ttuurrnn의 프로젝트와 학습 기록으로 연결되는 MyLink 페이지입니다."
    >
    <meta name="theme-color" content="#090909">
    <title>MyLink</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <span class="wordmark" aria-label="MyLink">MyLink</span>
    </header>

    <main class="site-main">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">My<span>Link</span></h1>
        <p>프로젝트와 학습 기록을 한곳에서 확인하세요.</p>
      </section>

      <a
        class="profile-link"
        href="https://github.com/ttuurrnn"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub 프로필 새 탭에서 열기"
      >
        <span class="profile-link__identity">
          <svg
            class="profile-link__icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.3-5.27-1.3-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.4-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"
            />
          </svg>
          <span class="profile-link__label">GitHub 프로필</span>
        </span>
        <span class="profile-link__handle">@ttuurrnn</span>
        <svg
          class="profile-link__arrow"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M5 12h14M13 6l6 6-6 6"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
          />
        </svg>
      </a>
    </main>

    <footer class="site-footer">Built with GitHub Pages</footer>
  </body>
</html>
